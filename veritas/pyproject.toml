[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Veritas AI Audit Engine - MVP service (Phase 0 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=42,<46",
    "pydantic-settings>=2.4,<3",
    # Parse-safety gate (§6.2): openpyxl (read_only + data_only, no formula
    # eval) for XLSX, pyarrow for Parquet. CSV/JSON use the standard library.
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<21",
    # Rule sets are versioned YAML config (§7.3) loaded at run start.
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
